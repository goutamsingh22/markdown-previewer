<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Previewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="app-bar">
            <div class="brand">
                <div class="logo">M</div>
                <div class="brand-text">
                    <h1>Markdown Previewer</h1>
                    <p>Write Markdown, preview the formatted output</p>
                </div>
            </div>
            <div class="app-actions">
                <button id="sampleBtn" class="btn ghost" type="button">Load Sample</button>
                <button id="clearBtn" class="btn ghost" type="button">Clear</button>
                <button id="downloadBtn" class="btn ghost" type="button">Download .md</button>
                <button id="copyHtmlBtn" class="btn ghost" type="button">Copy HTML</button>
                <button id="themeBtn" class="btn icon" type="button" title="Toggle theme" aria-label="Toggle theme">Dark</button>
            </div>
        </header>

        <main class="workspace">
            <section class="pane editor-pane" aria-label="Markdown editor">
                <div class="pane-head">
                    <div class="pane-title">
                        <span class="dot"></span>
                        Markdown
                    </div>
                    <div class="toolbar" role="toolbar" aria-label="Formatting tools">
                        <button class="tool bold" type="button" data-action="bold" title="Bold (Ctrl+B)">B</button>
                        <button class="tool italic" type="button" data-action="italic" title="Italic (Ctrl+I)">I</button>
                        <button class="tool strike" type="button" data-action="strike" title="Strikethrough">S</button>
                        <button class="tool" type="button" data-action="heading" title="Heading">H</button>
                        <button class="tool" type="button" data-action="link" title="Link (Ctrl+K)">Link</button>
                        <button class="tool" type="button" data-action="image" title="Image">Img</button>
                        <button class="tool code" type="button" data-action="code" title="Inline code">&lt;/&gt;</button>
                        <button class="tool" type="button" data-action="codeblock" title="Code block">Block</button>
                        <button class="tool" type="button" data-action="ul" title="Bullet list">List</button>
                        <button class="tool" type="button" data-action="ol" title="Numbered list">1.</button>
                        <button class="tool" type="button" data-action="task" title="Task list">Task</button>
                        <button class="tool" type="button" data-action="quote" title="Blockquote">Quote</button>
                        <button class="tool" type="button" data-action="table" title="Table">Table</button>
                        <button class="tool" type="button" data-action="hr" title="Horizontal rule">HR</button>
                    </div>
                </div>
                <textarea id="editor" spellcheck="false" placeholder="Start writing Markdown here..." aria-label="Markdown input"></textarea>
                <div class="pane-foot">
                    <span id="wordCount">0 words</span>
                    <span id="charCount">0 characters</span>
                    <span id="lineCount">0 lines</span>
                </div>
            </section>

            <section class="pane preview-pane" aria-label="Rendered preview">
                <div class="pane-head">
                    <div class="pane-title">
                        <span class="dot accent"></span>
                        Preview
                    </div>
                    <span class="live-badge">Live</span>
                </div>
                <div id="preview" class="preview"></div>
            </section>
        </main>

        <footer class="app-foot">
            <span>Supports headings, lists, tables, code blocks, links, images and more.</span>
            <span>Ctrl+B / Ctrl+I / Ctrl+K for quick formatting</span>
        </footer>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
</body>
</html>
